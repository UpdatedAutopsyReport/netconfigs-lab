! R2-MEL  Melbourne WAN edge router
!
hostname R2-MEL
!
banner motd ^
Authorised access only. All activity is logged.
^
!
interface GigabitEthernet0/0
 description LAN
 ip address 10.20.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description WAN to R1-SYD
 ip address 172.16.12.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 passive-interface GigabitEthernet0/0
 network 10.20.10.0 0.0.0.255 area 0
 network 172.16.12.0 0.0.0.3 area 0
!
ntp server 10.10.20.10
logging host 10.10.20.50
snmp-server location Melbourne office
!
end
