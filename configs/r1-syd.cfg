! R1-SYD  Sydney WAN edge router
!
hostname R1-SYD
!
banner motd ^
Authorised access only. All activity is logged.
^
!
interface GigabitEthernet0/0
 description Trunk to SW1-SYD
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description DATA
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description MGMT
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
!
interface GigabitEthernet0/1
 description WAN to R2-MEL via Telstra
 ip address 172.16.12.1 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0.10
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 172.16.12.0 0.0.0.3 area 0
!
ntp server 10.10.20.10
ntp server 10.10.20.11
logging host 10.10.20.51
snmp-server location Sydney DC1
!
end
